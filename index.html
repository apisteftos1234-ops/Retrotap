<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoHistory - Timeline Challenge</title>
    <style>
        /* 🌌 Premium Dark Cyber Styling Matrix */
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1e2235;
            --accent-neon: #00ffcc;
            --text-light: #f0f4f8;
            --text-muted: #8fa0dd;
            --border-glow: #2f3756;
            --correct-green: #39ff14;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #131722, #1a1f30);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        .hearts-display {
            color: #ff3366;
            font-size: 20px;
            letter-spacing: 3px;
        }

        .score-badge {
            color: var(--text-muted);
        }

        .score-badge strong {
            color: var(--accent-neon);
        }

        .card-deck {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed var(--border-glow);
        }

        .instruction {
            color: var(--text-muted);
            margin: 0 0 15px 0;
            font-size: 14px;
        }

        /* 🃏 Active Card Design Layout */
        .historical-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-neon);
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            text-align: center;
            cursor: grab;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            transition: transform 0.2s;
        }

        .historical-card:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        .card-emoji {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin: 5px 0;
        }

        .card-category {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 20px;
            display: inline-block;
        }

        /* 📍 Timeline Track & Drop Slots */
        .timeline-track {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            padding: 10px 0;
        }

        .timeline-slot {
            height: 25px;
            background: rgba(0, 255, 204, 0.03);
            border: 1px dashed rgba(0, 255, 204, 0.2);
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(0, 255, 204, 0.4);
            font-size: 12px;
        }

        .timeline-slot.drag-over {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid var(--accent-neon);
            height: 40px;
        }

        .placed-card {
            background: linear-gradient(135deg, #1b1f32, #242943);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }

        .placed-card.new-correct {
            border-color: var(--correct-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }

        .placed-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .placed-year {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-neon);
            background: rgba(0, 255, 204, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 70px;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }

        .modal-card {
            background: #161a2b;
            border: 1px solid var(--border-glow);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .modal-btn {
            background: var(--accent-neon);
            color: var(--bg-dark);
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header Controls & Metrics -->
        <header class="game-header">
            <div class="brand">GeoHistory</div>
            <div class="stats">
                <span id="hearts-display" class="hearts-display">♥♥♥</span>
                <span class="score-badge">Streak: <strong id="score">0</strong></span>
            </div>
        </header>

        <!-- Active Card to Place -->
        <section class="card-deck">
            <p class="instruction">Drag the event card into its correct historical position below:</p>
            <div id="deck-slot">
                <!-- Spawns dynamically via JS -->
            </div>
        </section>

        <!-- Chronological Timeline Stack -->
        <section id="timeline" class="timeline-track">
            <!-- Interleaved drop slots and cards spawn dynamically -->
        </section>
    </div>

    <!-- Game Status End Modal -->
    <div id="end-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title" style="color: var(--accent-neon);">GAME OVER</h2>
            <p id="modal-desc" style="color: var(--text-muted);"></p>
            <button class="modal-btn" onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <script>
        // 🗃️ Master Local Database Array from your Repository Image Schema
        const dataset = [
            { id: 1, title: "Construction of the Parthenon", year: -447, category: "Ancient History", image: "🏛️" },
            { id: 2, title: "Fall of Constantinople", year: 1453, category: "Middle Ages", image: "🏰" },
            { id: 3, title: "Greek War of Independence", year: 1821, category: "Modern History", image: "⚔️" },
            { id: 4, title: "First Modern Olympic Games (Athens)", year: 1896, category: "Sports History", image: "🏆" },
            { id: 5, title: "Apollo 11 Moon Landing", year: 1969, category: "Space Exploration", image: "🚀" },
            { id: 6, title: "Invention of the Printing Press", year: 1440, category: "Inventions", image: "🖨️" },
            { id: 7, title: "Discovery of America by Columbus", year: 1492, category: "Exploration", image: "⛵" }
        ];

        // Engine State Parameters
        let remainingCards = [];
        let placedCards = [];
        let activeCard = null;
        let lives = 3;
        let score = 0;

        function initGame() {
            remainingCards = [...dataset];
            placedCards = [];
            lives = 3;
            score = 0;
            
            // On startup, choose one random seed card to anchors the timeline structure
            const seedIndex = Math.floor(Math.random() * remainingCards.length);
            placedCards.push(remainingCards.splice(seedIndex, 1)[0]);
            
            updateMetrics();
            spawnNextCard();
            renderTimeline();
        }

        function updateMetrics() {
            document.getElementById('score').innerText = score;
            document.getElementById('hearts-display').innerText = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
        }

        function spawnNextCard() {
            const deckSlot = document.getElementById('deck-slot');
            deckSlot.innerHTML = '';

            if (remainingCards.length === 0) {
                triggerEndGame(true);
                return;
            }

const randIndex = Math.floor(Math.random() * remainingCards.length);
activeCard = remainingCards.splice(randIndex, 1)[0];
const cardEl = document.createElement('div');
cardEl.className = 'historical-card';
cardEl.draggable = true;
cardEl.innerHTML = <div class="card-emoji">${activeCard.image}</div> <div class="card-title">${activeCard.title}</div> <div class="card-category">${activeCard.category}</div>;
cardEl.addEventListener('dragstart', (e) => {
e.dataTransfer.setData('text/plain', activeCard.id);
});
deckSlot.appendChild(cardEl);
}
function renderTimeline() {
const timeline = document.getElementById('timeline');
timeline.innerHTML = '';
// Generate dropslots preceding and interleaved between all sorted historical elements
for (let i = 0; i <= placedCards.length; i++) {
const slot = document.createElement('div');
slot.className = 'timeline-slot';
slot.dataset.index = i;
slot.innerText = "DROP CARD HERE";
slot.addEventListener('dragover', (e) => {
e.preventDefault();
slot.classList.add('drag-over');
});
slot.addEventListener('dragleave', () => {
slot.classList.remove('drag-over');
});
slot.addEventListener('drop', (e) => {
e.preventDefault();
slot.classList.remove('drag-over');
handleCardDrop(parseInt(slot.dataset.index));
});
timeline.appendChild(slot);
// Render the chronological item blocks
if (i < placedCards.length) {
const item = placedCards[i];
const itemEl = document.createElement('div');
itemEl.className = placed-card ${item.id === (activeCard?.idLastCorrect || null) ? 'new-correct' : ''};
const formatYear = item.year < 0 ? ${Math.abs(item.year)} BC : ${item.year} AD;
itemEl.innerHTML = <div class="placed-info"> <span style="font-size: 20px;">${item.image}</span> <span style="font-weight: 500;">${item.title}</span> </div> <div class="placed-year">${formatYear}</div>;
timeline.appendChild(itemEl);
}
}
}
function handleCardDrop(dropIndex) {
if (!activeCard) return;
// Mathematical verification check: construct hypothetical timeline matrix
const testTimeline = [...placedCards];
testTimeline.splice(dropIndex, 0, activeCard);
// Verify if array sorting order matches strict linear chronological timeline flow
let isCorrect = true;
for (let i = 0; i < testTimeline.length - 1; i++) {
if (testTimeline[i].year > testTimeline[i + 1].year) {
isCorrect = false;
break;
}
}
if (isCorrect) {
score++;
activeCard.idLastCorrect = activeCard.id; // Highlight on UI track
placedCards.splice(dropIndex, 0, activeCard);
updateMetrics();
spawnNextCard();
renderTimeline();
} else {
lives--;
updateMetrics();
if (lives <= 0) {
triggerEndGame(false);
} else {
alert(❌ Incorrect Position! The event did not happen at that period. Lose 1 life.);
// Return card loop buffer back into deck sequence pool
remainingCards.push(activeCard);
spawnNextCard();
renderTimeline();
}
}
}
function triggerEndGame(hasWon) {
const modal = document.getElementById('end-modal');
const title = document.getElementById('modal-title');
const desc = document.getElementById('modal-desc');
if (hasWon) {
title.innerText = "👑 VICTORY!";
title.style.color = "var(--correct-green)";
desc.innerText = Sensational history tracking skill! You perfectly mapped every timeline anomaly with a clean streak score of: ${score}.;
} else {
title.innerText = "💀 GAME OVER";
title.style.color = "#ff3366";
desc.innerText = You ran out of historical lifeline tracks. Your final timeline accuracy streak was: ${score} points.;
}
modal.classList.add('active');
}
function resetGame() {
document.getElementById('end-modal').classList.remove('active');
initGame();
}
// Auto initialization call on runtime loads
window.onload = initGame;
