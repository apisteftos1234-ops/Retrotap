<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Outs & Equity Solver - Klaudigal Studios</title>
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(20, 20, 35, 0.45);
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --text-main: #f0f0f5;
            --text-muted: #8fa0a6;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 30%, #150d2a 0%, var(--bg-color) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        #calc-container {
            max-width: 440px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 0, 85, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(255, 0, 85, 0.05),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        #calc-container:hover {
            border-color: rgba(255, 0, 85, 0.45);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        0 0 40px rgba(255, 0, 85, 0.15);
        }

        h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 25px 0;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            color: var(--neon-pink);
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.2);
        }

        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            border: 1px solid rgba(143, 160, 166, 0.2);
            background: rgba(10, 10, 20, 0.8);
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            cursor: pointer;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%238fa0a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        select:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.15);
        }

        .btn {
            background: linear-gradient(90deg, var(--neon-pink) 0%, #d60044 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.45);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(255, 0, 85, 0.3);
        }

        #result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(5, 5, 10, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(0, 243, 255, 0.15);
            font-size: 15px;
            line-height: 1.8;
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease-out forwards;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 0;
        }

        .result-item:last-child {
            border-bottom: none;
            padding-top: 10px;
            margin-top: 4px;
        }

        .label-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .highlight {
            color: var(--neon-cyan);
            font-weight: 700;
            font-family: monospace;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .highlight-large {
            color: #39ff14;
            font-weight: 800;
            font-family: monospace;
            font-size: 24px;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
        }
    </style>
</head>
<body>

<div id="calc-container">
    <h2>🃏 Poker Outs &amp; Equity Solver</h2>
    <p class="subtitle">Select your active draw on the flop to instantly calculate your outs and win equity by the turn and river.</p>
    
    <div class="input-group">
        <label for="draw-type">Select Your Hand Draw</label>
        <select id="draw-type">
            <option value="4">Gutshot Straight Draw (4 Outs)</option>
            <option value="8">Open-Ended Straight Draw (8 Outs)</option>
            <option value="9">Flush Draw (9 Outs)</option>
            <option value="12">Flush + Gutshot Draw (12 Outs)</option>
            <option value="15">Flush + Open-Ended Draw (15 Outs)</option>
            <option value="6">Overcards Only (6 Outs)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="street">Current Street</label>
        <select id="street">
            <option value="flop">On the Flop (2 cards to come)</option>
            <option value="turn">On the Turn (1 card to come)</option>
        </select>
    </div>
    
    <button class="btn" onclick="calculateEquity()">SOLVE HAND EQUITY</button>
    
    <div id="result-box">
        <div class="result-item">
            <span class="label-text">Unseen Cards Left:</span>
            <span id="cards-left" class="highlight">47</span>
        </div>
        <div class="result-item">
            <span class="label-text">Exact Win Outs:</span>
            <span id="outs-output" class="highlight">0</span>
        </div>
        <div class="result-item">
            <span class="label-text">Mathematical Equity:</span>
            <span id="equity-output" class="highlight-large">0.00%</span>
        </div>
    </div>
</div>

<script>
    function calculateEquity() {
        let outs = parseInt(document.getElementById('draw-type').value);
        const street = document.getElementById('street').value;
        
        let totalCards = (street === 'flop') ? 47 : 46;
        let equity = 0;

        if (street === 'flop') {
            let missTurnProb = (totalCards - outs) / totalCards;
            let missRiverProb = (totalCards - 1 - outs) / (totalCards - 1);
            equity = (1 - (missTurnProb * missRiverProb)) * 100;
        } else {
            equity = (outs / totalCards) * 100;
        }

        document.getElementById('cards-left').innerText = totalCards;
        document.getElementById('outs-output').innerText = outs;
        document.getElementById('equity-output').innerText = equity.toFixed(2) + "%";
        document.getElementById('result-box').style.display = "block";
    }
</script>
</body>
</html>
