<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToPost Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div class="flex h-screen overflow-hidden">
    
    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
      <div>
        <!-- Logo -->
        <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
          <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white text-xl">S</div>
          <div>
            <h1 class="font-bold text-lg tracking-wide text-white">SnapTo<span class="text-indigo-400">Post</span></h1>
            <p class="text-xs text-slate-400">Business Control Panel</p>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="p-4 space-y-1 text-sm font-medium">
          <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30">
            <span>📊</span> <span>Επισκόπηση (Overview)</span>
          </a>
          <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <span>🍕</span> <span>Μενού & Κατάλογος</span>
          </a>
          <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition justify-between">
            <div class="flex items-center space-x-3">
              <span>📸</span> <span>Blitz Mode (AI Posts)</span>
            </div>
            <span class="bg-indigo-500/20 text-indigo-300 text-[10px] font-bold px-2 py-0.5 rounded-full">10 New</span>
          </a>
          <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <span>🛵</span> <span>Παραγγελίες (Live)</span>
          </a>
          <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <span>📅</span> <span>Κρατήσεις & Ραντεβού</span>
          </a>
          <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <span>🛒</span> <span>Εξοπλισμός & Partners</span>
          </a>
        </nav>
      </div>

      <!-- Account / Subdomain Status -->
      <div class="p-4 border-t border-slate-800 bg-slate-900/50">
        <div class="flex items-center space-x-3">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
          <div class="overflow-hidden">
            <p class="text-sm font-semibold text-white truncate">Η Γεύση</p>
            <p class="text-xs text-indigo-400 truncate">gefsi.snaptopost.com</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="flex-1 overflow-y-auto bg-slate-950 p-8 space-y-6">
      
      <!-- Welcome Trial Banner -->
      <div class="bg-gradient-to-r from-indigo-900/40 via-purple-900/30 to-slate-900 border border-indigo-500/30 rounded-2xl p-6 space-y-3">
        <div class="flex justify-between items-center">
          <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">
            🎉
