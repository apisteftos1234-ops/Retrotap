<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToPost - Start 7-Day Free Trial</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative overflow-hidden">
    
    <!-- Top Glow Accent -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500"></div>

    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center space-x-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold">
        <span>🎉 7-Day Free Trial • No Credit Card Required</span>
      </div>
      <h2 class="text-2xl font-extrabold text-white">Create Your Account</h2>
      <p class="text-xs text-slate-400">Get your direct menu/booking web app & 10 AI posts in 90 seconds.</p>
    </div>

    <!-- Trial Registration Form -->
    <form class="space-y-4">
      
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
        <input type="text" placeholder="Γιώργος Παπαδόπουλος" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Work Email</label>
        <input type="email" placeholder="info@gefsitaverna.gr" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Mobile Phone Number (for WhatsApp Alerts)</label>
        <input type="tel" placeholder="691 234 5678" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Business Name & Subdomain</label>
        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
          <input type="text" placeholder="gefsi" class="bg-transparent w-full text-white focus:outline-none font-mono text-sm">
          <span class="text-xs text-indigo-400 font-mono">.snaptopost.com</span>
        </div>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">
        🚀 Start Free Trial & Launch Staging Site →
      </button>

    </form>

    <div class="text-center text-[11px] text-slate-500 pt-2 border-t border-slate-800/80">
      By signing up, you agree to our Terms of Service. You can cancel anytime inside your admin dashboard.
    </div>

  </div>

</body>
</html>
