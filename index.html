<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Outs & Equity Solver - Klaudigal Studios</title>
    <style>
        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
            background-color: #0b0c10; color: #66fcf1; text-align: center;
        }
        #calc-container {
            max-width: 450px; margin: 40px auto; background: #1f2833; padding: 25px;
            border-radius: 16px; border: 2px solid #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }
        .input-group {
            margin: 15px 0; text-align: left;
        }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #ff0055; }
        select {
            width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
            border: 2px solid #ff0055; background: #0b0c10; color: white;
        }
        .btn {
            background-color: #45f3ff; color: #0b0c10; border: none; padding: 14px;
            font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.4);
        }
        .btn:hover { background-color: #33cbd6; }
        #result-box {
            margin-top: 25px; padding: 15px; background: #0b0c10; border-radius: 8px;
            font-size: 18px; font-weight: bold; display: none; border: 1px solid #66fcf1; text-align: left;
        }
        .highlight { color: #66fcf1; font-size: 22px; }
    </style>
</head>
<body>

<div id="calc-container">
    <h2>🃏 Poker Outs & Equity Solver</h2>
    <p>Select your active draw on the flop to instantly calculate your outs and win equity by the turn and river.</p>
    
    <div class="input-group">
        <label for="draw-type">Select Your Hand Draw:</label>
        <select id="draw-type">
            <option value="4">Gutshot Straight Draw (4 Outs)</option>
            <option value="8">Open-Ended Straight Draw (8 Outs)</option>
            <option value="9">Flush Draw (9 Outs)</option>
            <option value="12">Flush + Gutshot Draw (12 Outs)</option>
            <option value="13">Flush + Open-Ended Draw (15 Outs)</option>
            <option value="6">Overcards Only (6 Outs)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="street">Current Street:</label>
        <select id="street">
            <option value="flop">On the Flop (2 cards to come)</option>
            <option value="turn">On the Turn (1 card to come)</option>
        </select>
    </div>
    
    <button class="btn" onclick="calculateEquity()">SOLVE HAND EQUITY</button>
    
    <div id="result-box">
        • Unseen Cards Left: <span id="cards-left" class="highlight">47</span><br>
        • Exact Win Outs: <span id="outs-output" class="highlight">0</span><br>
        • Mathematical Hand Equity: <span id="equity-output" class="highlight">0%</span>
    </div>
</div>

<script>
    function calculateEquity() {
        let outs = parseInt(document.getElementById('draw-type').value);
        const street = document.getElementById('street').value;
        
        let totalCards = (street === 'flop') ? 47 : 46;
        let equity = 0;

        if (street === 'flop') {
            let missTurnProb = (totalCards - outs) / totalCards;
            let missRiverProb = (totalCards - 1 - outs) / (totalCards - 1);
            equity = (1 - (missTurnProb * missRiverProb)) * 100;
        } else {
            equity = (outs / totalCards) * 100;
        }

        document.getElementById('cards-left').innerText = totalCards;
        document.getElementById('outs-output').innerText = outs;
        document.getElementById('equity-output').innerText = equity.toFixed(2) + "%";
        document.getElementById('result-box').style.display = "block";
    }
</script>
</body>
</html>
