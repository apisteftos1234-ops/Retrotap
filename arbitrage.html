<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SureBet Arbitrage Calculator - Klaudigal Studios</title>
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(20, 20, 35, 0.45);
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-green: #39ff14;
            --text-main: #f0f0f5;
            --text-muted: #8fa0a6;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 30%, #0d152a 0%, var(--bg-color) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        #calc-container {
            max-width: 440px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 243, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(0, 243, 255, 0.05),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        #calc-container:hover {
            border-color: rgba(0, 243, 255, 0.45);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        0 0 40px rgba(0, 243, 255, 0.15);
        }

        h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 25px 0;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            border: 1px solid rgba(143, 160, 166, 0.2);
            background: rgba(10, 10, 20, 0.8);
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
        }

        .btn {
            background: linear-gradient(90deg, var(--neon-cyan) 0%, #00bc44 100%);
            background: linear-gradient(90deg, var(--neon-cyan) 0%, #00b0b8 100%);
            color: #0b0c10;
            border: none;
            padding: 15px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.2);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.35);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(0, 243, 255, 0.2);
        }

        #result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(5, 5, 10, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 85, 0.15);
            font-size: 15px;
            line-height: 1.8;
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease-out forwards;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 0;
        }

        .result-item:last-child {
            border-bottom: none;
            padding-top: 10px;
            margin-top: 4px;
        }

        .label-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .value-text {
            font-family: monospace;
            font-size: 16px;
            font-weight: 600;
        }

        .status-profit {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .status-loss {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .highlight-large {
            font-weight: 800;
            font-family: monospace;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div id="calc-container">
    <h2>📊 SureBet Arbitrage</h2>
    <p class="subtitle">Input decimal odds for the same event from two separate bookmakers to find risk-free profit loops.</p>
    
    <div class="input-group">
        <label for="total-stake">Total Budget ($ / €)</label>
        <input type="number" id="total-stake" value="100" step="1">
    </div>
    
    <div class="input-group">
        <label for="odds-a">Bookmaker 1 Odds (Outcome A)</label>
        <input type="number" id="odds-a" placeholder="e.g. 2.15" step="0.01">
    </div>

    <div class="input-group">
        <label for="odds-b">Bookmaker 2 Odds (Outcome B)</label>
        <input type="number" id="odds-b" placeholder="e.g. 1.95" step="0.01">
    </div>
    
    <button class="btn" onclick="calculateArbitrage()">ANALYZE ODDS</button>
    
    <div id="result-box">
        <div class="result-item">
            <span class="label-text">Arbitrage Market Index:</span>
            <span id="arb-percent" class="value-text">0.00%</span>
        </div>
        <div class="result-item">
            <span class="label-text">Analysis Status:</span>
            <span id="arb-status" style="font-weight:700;">Analyzing...</span>
        </div>
        <div class="result-item">
            <span class="label-text">Stake on Outcome A:</span>
            <span id="stake-a" class="value-text" style="color:var(--neon-cyan)">$0.00</span>
        </div>
        <div class="result-item">
            <span class="label-text">Stake on Outcome B:</span>
            <span id="stake-b" class="value-text" style="color:var(--neon-cyan)">$0.00</span>
        </div>
        <div class="result-item">
            <span class="label-text">Guaranteed Payout:</span>
            <span id="net-profit" class="highlight-large">$0.00</span>
        </div>
    </div>
</div>

<script>
    function calculateArbitrage() {
        const totalStake = parseFloat(document.getElementById('total-stake').value);
        const oddsA = parseFloat(document.getElementById('odds-a').value);
        const oddsB = parseFloat(document.getElementById('odds-b').value);
        
        if (isNaN(totalStake) || isNaN(oddsA) || isNaN(oddsB) || oddsA <= 0 || oddsB <= 0) {
            alert("Please enter valid positive numbers for your investment stakes and lines.");
            return;
        }

        let invOddsA = 1 / oddsA;
        let invOddsB = 1 / oddsB;
        let totalArbitrage = invOddsA + invOddsB;
        
        document.getElementById('arb-percent').innerText = (totalArbitrage * 100).toFixed(2) + "%";
        
        const statusSpan = document.getElementById('arb-status');
        const profitSpan = document.getElementById('net-profit');

        let stakeA = (invOddsA / totalArbitrage) * totalStake;
        let stakeB = (invOddsB / totalArbitrage) * totalStake;
        let payout = stakeA * oddsA;
        let netProfitValue = payout - totalStake;

        document.getElementById('stake-a').innerText = "$" + stakeA.toFixed(2);
        document.getElementById('stake-b').innerText = "$" + stakeB.toFixed(2);

        if (totalArbitrage < 1.0) {
            statusSpan.innerText = "PROFIT ARCS FOUND";
            statusSpan.className = "status-profit";
            profitSpan.style.color = "var(--neon-green)";
            profitSpan.style.textShadow = "0 0 12px rgba(57, 255, 20, 0.4)";
            profitSpan.innerText = "$" + payout.toFixed(2) + " (+" + ((netProfitValue / totalStake) * 100).toFixed(2) + "%)";
        } else {
            statusSpan.innerText = "NO ARBITRAGE";
            statusSpan.className = "status-loss";
            profitSpan.style.color = "var(--neon-pink)";
            profitSpan.style.textShadow = "0 0 12px rgba(255, 0, 85, 0.4)";
            profitSpan.innerText = "$" + payout.toFixed(2) + " (" + ((netProfitValue / totalStake) * 100).toFixed(2) + "%)";
        }

        document.getElementById('result-box').style.display = "block";
    }
</script>
</body>
</html>
